# CoCo End-to-End Attestation Test Pod
#
# Tests the full TDX attestation flow:
#   1. Pod starts with kata-cc runtime in TDX VM
#   2. CDH contacts KBS, generates TDX quote
#   3. KBS verifies DCAP quote and measurements
#   4. CDH fetches sealed secret from KBS
#
# Prerequisites:
#   - KBS secret exists: ./scripts/kbs-secrets.sh set attestation-test test-value 'your-secret'
#   - KBS secret registered: ./scripts/kbs-secrets.sh register attestation-test test-value
#
# Usage:
#   INITDATA=$(./scripts/generate-initdata.sh debug)
#   sed "s|REPLACE_WITH_INITDATA|$INITDATA|" testbed/workloads/coco-attestation-test.yaml | oc apply -f -
#
#   # Check results
#   oc logs coco-attestation-test -c fetch-secret
#   oc logs coco-attestation-test -c result
#
#   # Check KBS attestation logs
#   oc logs -n trustee-operator-system -l app=kbs -c kbs --tail=20
#
#   # Cleanup
#   oc delete pod coco-attestation-test
apiVersion: v1
kind: Pod
metadata:
  name: coco-attestation-test
  namespace: default
  labels:
    app: coco-attestation-test
  annotations:
    io.katacontainers.config.hypervisor.default_memory: "4096"
    io.containerd.cri.runtime-handler: kata-cc
    io.katacontainers.config.hypervisor.cc_init_data: "REPLACE_WITH_INITDATA"
spec:
  runtimeClassName: kata-cc
  initContainers:
  - name: fetch-secret
    image: registry.access.redhat.com/ubi9/ubi:latest
    command:
    - /bin/bash
    - -c
    - |
      echo "Fetching sealed secret from KBS via CDH..."
      RESULT=$(curl -sf --retry 5 --retry-delay 3 --retry-connrefused \
        http://127.0.0.1:8006/cdh/resource/default/attestation-test/test-value 2>&1)
      RC=$?
      if [ $RC -eq 0 ]; then
        echo "SUCCESS: attestation completed, secret retrieved"
        echo "$RESULT" > /shared/secret.txt
      else
        echo "FAILED: could not retrieve secret (exit code $RC)"
        echo "$RESULT"
        echo "ATTESTATION_FAILED: $RESULT" > /shared/secret.txt
      fi
    securityContext:
      privileged: true
    volumeMounts:
    - name: shared
      mountPath: /shared
  containers:
  - name: result
    image: registry.access.redhat.com/ubi9/ubi-minimal:latest
    command:
    - /bin/bash
    - -c
    - |
      echo "=== CoCo Attestation Test Results ==="
      echo "Secret file contents:"
      cat /shared/secret.txt
      echo ""
      if grep -q "ATTESTATION_FAILED" /shared/secret.txt 2>/dev/null; then
        echo "RESULT: FAIL"
      else
        echo "RESULT: PASS"
      fi
      sleep 3600
    volumeMounts:
    - name: shared
      mountPath: /shared
    resources:
      requests:
        memory: "4Gi"
      limits:
        memory: "4Gi"
  volumes:
  - name: shared
    emptyDir: {}
  restartPolicy: Never
